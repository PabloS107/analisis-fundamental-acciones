[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codigo_analisis_fundamental"
version = "1.0.0"
description = "Motor Universal y Arquitectura de Analisis Fundamental de Acciones"
authors = [
    { name = "Auditoria Financiera", email = "auditor_financiero@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0.0,<=6.1.1",
    "edgartools>=5.0.0",
    "yfinance>=0.2.0",
    "requests>=2.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-docx>=1.0.0",
    "pypdf>=4.0.0"
]
